<!doctype html>
<html lang="__LANG__"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="ad.orientation" content="portrait,landscape">
<title>StarFoot</title>
__NETWORK_HEAD__
<style>
__FONTS__
:root{--display:"Saira Condensed","Arial Narrow",sans-serif;--muted:#8fa0c8;--flood:#ffcf3f;--flood-ink:#1a1400}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#060d24;color:#f3f1ea;font-family:"Barlow Semi Condensed",system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#host{flex:1;min-height:0;display:flex;flex-direction:column}
.mg{flex:1;min-height:0;display:flex;flex-direction:column}
.mg-stage{flex:1;min-height:0;position:relative;overflow:hidden}
.mg-canvas{position:absolute;inset:0;display:block;touch-action:none;cursor:crosshair}
.mg-lift{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px;background:#050b1d}
.mg-lift button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 4px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:#101a3a;color:#f3f1ea;font-family:inherit;cursor:pointer}
.mg-lift button b{font-family:var(--display);font-weight:800;font-size:18px;text-transform:uppercase;letter-spacing:.04em}
.mg-lift button small{color:var(--muted);font-size:12px}
.mg-lift button.on{background:var(--flood);color:var(--flood-ink);border-color:var(--flood)}
.mg-lift button.on small{color:rgba(26,20,0,.75)}
.mg-lift.locked{opacity:.45;pointer-events:none}
.mg-skip{position:absolute;right:12px;bottom:12px;z-index:5;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:10px 16px;background:rgba(5,11,29,.82);color:#fff;font:800 15px "Barlow Semi Condensed",system-ui,sans-serif;cursor:pointer}
.mg-replay{position:absolute;left:12px;top:12px;z-index:5;display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:8px;background:rgba(5,11,29,.82);color:#fff;font:800 13px "Barlow Semi Condensed",system-ui,sans-serif;letter-spacing:1px;pointer-events:none}
.mg-replay i{width:9px;height:9px;border-radius:50%;background:#e1283e;animation:rec 1s infinite}@keyframes rec{50%{opacity:.2}}
/* üst şerit */
#bar{display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:linear-gradient(#0b1736,#081028);border-bottom:1px solid rgba(255,255,255,.08);z-index:6}
#bar img{width:34px;height:34px;border-radius:8px}
#bar .lg{font:italic 800 22px var(--display)}#bar .lg span{color:#ffcf3f}
#bar .sc{margin-left:auto;white-space:nowrap;display:flex;align-items:center;gap:8px;font:800 18px var(--display)}
#bar .sc b{background:#000;padding:2px 8px;border-radius:5px;color:#ffcf3f}
#bar .mn{background:#e1283e;color:#fff;padding:2px 7px;border-radius:5px;font:800 15px var(--display)}
@media (max-width:420px){#bar .lg{display:none}}
#bar .dl{margin-left:8px;background:#ffcf3f;color:#1a1400;border:0;font:italic 800 16px var(--display);padding:6px 12px;transform:skewX(-8deg);cursor:pointer;text-transform:uppercase}
/* giriş */
#intro{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(4,9,26,.78);text-align:center;padding:24px;transition:opacity .35s}
#intro .t1{font:800 20px var(--display);color:#ff5a6e;letter-spacing:.08em}
#intro .t2{font:italic 800 clamp(40px,11vw,76px)/.95 var(--display);text-transform:uppercase}
#intro .t2 em{color:#ffcf3f;font-style:inherit;display:block}
#intro .t3{font-size:19px;color:#c9d4f2;max-width:420px}
#hand{position:fixed;z-index:21;width:64px;height:64px;pointer-events:none;left:50%;top:62%;margin-left:-20px;animation:pull 1.4s ease-in-out infinite;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))}
@keyframes pull{0%{transform:translateY(0);opacity:0}15%{opacity:1}60%{transform:translateY(70px)}75%{transform:translateY(70px);opacity:1}100%{transform:translateY(-30px);opacity:0}}
.go{opacity:0;pointer-events:none}
#hand.go{display:none}
/* mesaj */
#msg{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:15;background:rgba(5,11,29,.9);border:1px solid rgba(255,207,63,.5);color:#ffe28a;font:800 20px var(--display);padding:8px 18px;border-radius:30px;white-space:nowrap;transition:opacity .3s}
/* bitiş kartı */
#end{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px;text-align:center;cursor:pointer;
background:radial-gradient(80% 50% at 50% 35%,rgba(255,207,63,.28),transparent 70%),radial-gradient(120% 90% at 50% 0%,#1d3b8f 0%,#0b1736 55%,#060d24 100%);animation:fin .45s ease-out}
@keyframes fin{from{opacity:0;transform:scale(1.05)}}
#end img{width:108px;height:108px;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
#end .lg{font:italic 800 40px var(--display)}#end .lg span{color:#ffcf3f}
#end .h{font:italic 800 clamp(34px,9vw,60px)/.95 var(--display);text-transform:uppercase}
#end .h em{display:block;color:#ffcf3f;font-style:inherit}
#end .s{font-size:19px;color:#c9d4f2;max-width:440px}
#end .ch{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#end .ch span{border:2px solid rgba(255,207,63,.55);color:#ffe28a;border-radius:30px;padding:4px 14px;font-weight:700;font-size:15px}
#end .cta{margin-top:6px;background:#ffcf3f;color:#1a1400;border:0;font:italic 800 34px var(--display);padding:12px 44px;transform:skewX(-8deg);text-transform:uppercase;animation:pulse 1.1s ease-in-out infinite;cursor:pointer}
@keyframes pulse{50%{transform:skewX(-8deg) scale(1.07)}}
#end .st{font-size:14px;color:#8fa0c8}
@media (orientation:portrait) and (max-height:760px){#end{gap:10px;padding:16px}#end img{width:76px;height:76px;border-radius:18px}#end .lg{font-size:30px}#end .h{font-size:min(44px,10vw)}#end .s{font-size:16px}#end .ch span{font-size:13px;padding:3px 10px}#end .cta{font-size:28px;padding:10px 36px}}
@media (orientation:landscape) and (max-height:500px){#end{gap:6px;padding:12px}#end img{width:56px;height:56px;border-radius:14px}#end .lg{display:none}#end .h{font-size:min(38px,10vh)}#end .s{display:none}#end .ch span{font-size:13px;padding:2px 10px}#end .cta{font-size:26px;padding:8px 34px;margin-top:2px}#end .st{font-size:12px}#intro .t3{display:none}#intro .t2{font-size:min(56px,14vh)}}
</style></head><body>
<div id="app">
  <div id="bar"><img src="__ICON__" alt=""><div class="lg">STAR<span>FOOT</span></div>
    <div class="sc"><span class="mn">90+4'</span><span>STR</span><b id="score">1 - 1</b><span>BCK</span></div>
    <button class="dl" id="dl">__T_INSTALL__</button></div>
  <div id="host"></div>
</div>
<div id="intro"><div class="t1">__T_FINAL__</div><div class="t2">__T_H1__<em>__T_H2__</em></div><div class="t3">__T_SUB__</div></div>
<svg id="hand" viewBox="0 0 64 64"><circle cx="20" cy="14" r="10" fill="rgba(255,255,255,.35)"/><path d="M18 8c2.5 0 4 1.8 4 4v14l2-.3V22c0-2 1.5-3.4 3.4-3.4S31 20 31 22v4l1.6-.2c.3-1.8 1.7-3 3.4-3 1.9 0 3.4 1.5 3.4 3.4v2l.8-.1c1.9-.2 3.6 1.2 3.6 3.2v10c0 9-6 16-15 16h-2c-5 0-8.6-2.4-11-6.6L8 37c-1-1.8-.4-4 1.4-5 1.6-.9 3.6-.4 4.6 1.1L14 34V12c0-2.2 1.8-4 4-4z" fill="#fff" stroke="#1a1400" stroke-width="2"/></svg>
<div id="msg" class="go"></div>
<script>
__GAME__
</script>
<script>

</script>
</body></html>
