<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<style id="fonts"></style>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="cv" width="1080" height="1920"></canvas>
<script>
  // Oyunun yazı tipleri (store/premium/fonts)
  const FD = '../../premium/fonts';
  const fams = [['Saira Condensed', 'saira-condensed', [600, 800, 900]], ['Barlow Semi Condensed', 'barlow-semi-condensed', [400, 500, 600, 700]]];
  document.getElementById('fonts').textContent = fams.flatMap(([fam, f, ws]) => ws.flatMap((w) => ['latin', 'latin-ext'].map((sub) =>
    `@font-face{font-family:'${fam}';font-weight:${w};font-style:normal;src:url('${FD}/${f}-${sub}-${w}-normal.woff2') format('woff2');}`))).join('');
</script>
<script src="../../../js/util.js"></script>
<script src="../../../js/sprites.js"></script>
<script src="../../../js/socialart.js"></script>
<script src="ads.js"></script>
<script src="reels3.js"></script>
</body></html>
