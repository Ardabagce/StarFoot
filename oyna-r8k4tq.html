<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>StarFoot</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a1530">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StarFoot">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Playfair+Display:wght@700;900&family=Lora:ital,wght@0,400;0,600;1,400&family=Saira+Condensed:ital,wght@0,600;0,800;1,800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Başlık ekranı -->
  <section id="title" class="screen title-screen">
    <canvas id="title-art" aria-hidden="true"></canvas>
    <div class="lang-sw" id="lang-sw" data-noi18n><button id="lang-btn" aria-label="Language">🌐 <b>TR</b></button><div class="lang-menu hidden" id="lang-menu"></div></div>
    <div class="title-card">
      <div class="title-logo">STAR<span>FOOT</span></div>
      <div class="title-sub">Hayalindeki futbol kariyerine başla. Efsane ol.</div>
      <div class="slots" id="slots"></div>
      <div class="title-x" id="title-x"></div>
      <div class="title-note">Tüm kulüp ve oyuncu isimleri kurgusaldır.</div>
      <div class="title-foot"><a href="privacy.html" data-privacy>Gizlilik Politikası</a></div>
    </div>
  </section>

  <!-- Karakter oluşturma -->
  <section id="create" class="screen hidden"></section>

  <!-- Ana oyun -->
  <section id="hub" class="screen hidden">
    <div class="topbar">
    <header class="hdr">
      <div class="hdr-l">
        <div class="logo" id="logo">STAR<span>FOOT</span></div>
        <button type="button" class="notif-btn" id="notif-btn" aria-label="Bildirimler"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><i class="nb-n hidden" id="notif-n"></i></button>
      </div>
      <div class="hdr-info" id="hdr-info"></div>
    </header>
    <div id="status" class="status"></div>
    </div>
    <nav id="tabs" class="tabs">
      <button data-tab="home"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg><span>Merkez</span></button>
      <button data-tab="league"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 9h18M3 14h18M9 4v16"/></svg><span>Lig</span></button>
      <button data-tab="squad"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14.2c3 .2 5.5 2.6 5.5 5.8"/></svg><span>Kadro</span></button>
      <button data-tab="life"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-9-8.6C1.6 8.3 3.5 5 7 5c2 0 3.4 1.1 5 3 1.6-1.9 3-3 5-3 3.5 0 5.4 3.3 4 6.4-2 4.2-9 8.6-9 8.6z"/></svg><span>Yaşam</span></button>
      <button data-tab="profile" class="tab-prof"><span class="tab-av"><canvas class="so-avatar" aria-hidden="true"></canvas></span><span>Profil</span></button>
    </nav>
    <div class="layout">
      <aside id="side"></aside>
      <main id="main"></main>
    </div>
  </section>

  <!-- Kariyer sonu -->
  <section id="end" class="screen hidden"></section>

  <div id="match" class="overlay hidden"></div>
  <div id="modal" class="modal hidden"></div>
  <div id="toasts"></div>

  <script src="js/util.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/lang-en.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/ads-config.js"></script>
  <script src="js/admob.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/player.js"></script>
  <script src="js/league.js"></script>
  <script src="js/legends.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/shopart.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/minigame.js"></script>
  <script src="js/drills.js"></script>
  <script src="js/match.js"></script>
  <script src="js/tutorial.js"></script>
  <script src="js/game.js"></script>
  <script src="js/extras.js"></script>
  <script src="js/premium.js"></script>
  <script src="js/socialart.js"></script>
  <script src="js/celebrate.js"></script>
  <script src="js/life.js"></script>
  <script src="js/captain.js"></script>
  <script src="js/cups.js"></script>
  <script src="js/meta.js"></script>
  <script src="js/legacy.js"></script>
  <script src="js/wc.js"></script>
  <script src="js/lpath.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
