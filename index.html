<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>StarFoot</title>
  <meta name="theme-color" content="#0a1530">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StarFoot">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Saira+Condensed:ital,wght@0,600;0,800;1,800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Başlık ekranı -->
  <section id="title" class="screen title-screen">
    <canvas id="title-art" aria-hidden="true"></canvas>
    <div class="title-card">
      <div class="title-logo">STAR<span>FOOT</span></div>
      <div class="title-sub">Hayalindeki futbol kariyerine başla. Efsane ol.</div>
      <div class="slots" id="slots"></div>
      <div class="title-note">Tüm kulüp ve oyuncu isimleri kurgusaldır.</div>
    </div>
  </section>

  <!-- Karakter oluşturma -->
  <section id="create" class="screen hidden"></section>

  <!-- Ana oyun -->
  <section id="hub" class="screen hidden">
    <div class="topbar">
    <header class="hdr">
      <div class="logo" id="logo">STAR<span>FOOT</span></div>
      <div class="hdr-info" id="hdr-info"></div>
    </header>
    <div id="status" class="status"></div>
    </div>
    <nav id="tabs" class="tabs">
      <button data-tab="player" class="only-m"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2l4 2 4-2 6 3-2 6-3-1v12H7V10l-3 1-2-6z"/></svg><span>Oyuncu</span></button>
      <button data-tab="home"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg><span>Merkez</span></button>
      <button data-tab="league"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 9h18M3 14h18M9 4v16"/></svg><span>Lig</span></button>
      <button data-tab="squad"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14.2c3 .2 5.5 2.6 5.5 5.8"/></svg><span>Kadro</span></button>
      <button data-tab="shop"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16l-1.5 13h-13z"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/></svg><span>Mağaza</span></button>
      <button data-tab="career"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/></svg><span>Kariyer</span></button>
      <button data-tab="world"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg><span>Dünya</span></button>
    </nav>
    <div class="layout">
      <aside id="side"></aside>
      <main id="main"></main>
    </div>
  </section>

  <!-- Kariyer sonu -->
  <section id="end" class="screen hidden"></section>

  <div id="match" class="overlay hidden"></div>
  <div id="modal" class="modal hidden"></div>
  <div id="toasts"></div>

  <script src="js/util.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/player.js"></script>
  <script src="js/league.js"></script>
  <script src="js/legends.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/minigame.js"></script>
  <script src="js/match.js"></script>
  <script src="js/game.js"></script>
  <script src="js/extras.js"></script>
  <script src="js/cups.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
