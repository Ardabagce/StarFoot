# Android uygulamasını (Capacitor + AdMob) derler.
# Çıktılar: Actions › çalışma › Artifacts: starfoot-debug-apk (telefona kurup denemek için) ve starfoot-release-aab (Play'e yüklemek için).
# Yükleme anahtarı için depo sırları (Settings › Secrets and variables › Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Android
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'js/**'
      - 'css/**'
      - 'icons/**'
      - 'oyna-r8k4tq.html'
      - 'privacy.html'
      - '.github/workflows/android.yml'
defaults:
  run:
    shell: bash  # -eo pipefail: borudaki hata adımı düşürür
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # ubuntu-latest Android SDK ile birlikte gelir (ANDROID_HOME)
      - name: Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" && test -d "$ANDROID_HOME"
      - name: Bağımlılıklar
        working-directory: app
        run: npm ci
      # Firebase Analytics: GOOGLE_SERVICES_JSON sırrı (Firebase'den indirilen google-services.json içeriği) varsa açılır
      - name: Firebase (varsa)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: env.GSJ != ''
        working-directory: app
        run: |
          printf '%s' "$GSJ" > android/app/google-services.json
          node -e "const f='capacitor.config.json',c=require('./'+f);const p=c.android.includePlugins;if(!p.includes('@capacitor-firebase/analytics'))p.push('@capacitor-firebase/analytics');require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          echo "Firebase Analytics açık"
      - name: Web dosyalarını uygulamaya kopyala
        working-directory: app
        run: node copy-web.js && npx cap sync android
      - name: Yükleme anahtarı
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KS != ''
        working-directory: app/android
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$RUNNER_TEMP/upload.jks" "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > keystore.properties
      - name: Derle
        working-directory: app/android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export VERSION_CODE=$((100 + VERSION_CODE))
          echo "Sürüm kodu: $VERSION_CODE"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease
      - name: İmzayı doğrula
        working-directory: app/android/app/build/outputs/bundle/release
        run: |
          AAB=$(ls *.aab)
          if jarsigner -verify "$AAB" 2>&1 | grep "jar verified" >/dev/null; then
            echo "İMZALI: $AAB"
            # yalnız bilgi satırları: unzip bulamadığı sertifika türü için 11 döndürür, adımı düşürmesin
            jarsigner -verify -verbose -certs "$AAB" | grep -m1 -o "X.509, [^]]*" || true
            unzip -p "$AAB" 'META-INF/*.RSA' 'META-INF/*.EC' 'META-INF/*.DSA' 2>/dev/null | keytool -printcert | grep -E "Owner|SHA256:" | head -2 || true
          else
            echo "İMZASIZ: $AAB (ANDROID_KEYSTORE_* sırlarını kontrol et)"
            if [ -f ../../../../../keystore.properties ]; then exit 1; fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: starfoot-debug-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: starfoot-release-aab
          path: app/android/app/build/outputs/bundle/release/*.aab
