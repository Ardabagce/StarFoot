# Android uygulamasını (Capacitor + AdMob) derler.
# Çıktılar: Actions › çalışma › Artifacts: starfoot-debug-apk (telefona kurup denemek için) ve starfoot-release-aab (Play'e yüklemek için).
# Yükleme anahtarı için depo sırları (Settings › Secrets and variables › Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Android
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'js/**'
      - 'css/**'
      - 'icons/**'
      - 'index.html'
      - 'privacy.html'
      - '.github/workflows/android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Bağımlılıklar
        working-directory: app
        run: npm ci
      - name: Web dosyalarını uygulamaya kopyala
        working-directory: app
        run: node copy-web.js && npx cap sync android
      - name: Yükleme anahtarı
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KS != ''
        working-directory: app/android
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$RUNNER_TEMP/upload.jks" "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > keystore.properties
      - name: Derle
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: starfoot-debug-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: starfoot-release-aab
          path: app/android/app/build/outputs/bundle/release/*.aab
