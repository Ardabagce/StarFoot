# App Store Connect mağaza bilgilerini (tüm diller) store/asc/metadata.json'dan doldurur.
# iOS derlemesiyle aynı sırları kullanır: APPSTORE_API_KEY_P8, APPSTORE_KEY_ID, APPSTORE_ISSUER_ID
# Anahtarın App Store Connect'te "Admin" ya da "App Manager" rolü olmalı (mağaza bilgisi düzenlemek için).
name: App Store bilgileri
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Sürüm numarası (ör. 1.0.8): düzenlenebilir sürüm farklıysa ona çevrilir, yoksa oluşturulur. 1.0.12@183 = derleme 183 bağlanır, kademeli yayın açılır ve incelemeye gönderilir'
        required: false
        default: ''
      screens:
        description: 'Boş dillere ekran görüntüsü yükle'
        type: boolean
        default: true
      replace_screens:
        description: 'Mevcut ekran görüntülerini silip yeniden yükle'
        type: boolean
        default: false
      previews:
        description: 'Tanıtım videosunu (store/asc/preview) tüm dillere yükle; varsa değiştirir'
        type: boolean
        default: false
      prepare_only:
        description: 'Sürümü hazırla (derleme bağlı) ama incelemeye gönderme'
        type: boolean
        default: false
      dry_run:
        description: 'Yalnız göster, değiştirme'
        type: boolean
        default: false
      diagnose:
        description: 'Yalnız oku: hangi kayıtların açılmadığını göster'
        type: boolean
        default: false
      audit:
        description: 'Yalnız oku: her dilde hangi alanların dolu olduğunu göster'
        type: boolean
        default: false
      iap:
        description: 'Satın alma ürünleri: read = yalnız oku, setup = Premium dilleri ve notu, packs = içerik paketlerini oluştur/tamamla, submit = paketleri incelemeye gönder, unsubmit = paketleri reddedilen başvurudan çıkarıp güncelle, sale:30:2027-01-01:urun1,urun2 = süreli indirim (dry_run ile önce dene)'
        required: false
        default: ''
      events:
        description: 'Uygulama içi etkinlikleri ve öne çıkarılma başvurusunu taslak olarak oluştur (store/asc/events.json)'
        type: boolean
        default: false
      nominate:
        description: 'Öne çıkarılma başvurusu dosyası (ör. store/asc/nomination-1.0.17.json): oluşturur, dosyada submit varsa gönderir'
        required: false
        default: ''
      gamecenter:
        description: 'Game Center: başarımlar ve liderlik tabloları (store/asc/gamecenter.json)'
        type: boolean
        default: false
      sales:
        description: 'Satış raporu: vendor numarası (Ödemeler ve Finansal Raporlar sayfasının sol üstünde); son 30 gün'
        required: false
        default: ''
      ppo:
        description: 'Ürün sayfası A/B testi: list = mevcut testler, shots = hikaye sırası ekran görüntüleri, icons = alternatif ikonlar (dry_run ile önce dene)'
        required: false
        default: ''
      remove_locales:
        description: 'Düzenlenen sürümden silinecek diller (ör. it,id,ar-SA)'
        required: false
        default: ''
jobs:
  metadata:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
      ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'pyjwt[crypto]==2.10.1' 'requests==2.32.3'
      - name: Mağaza bilgilerini doldur
        run: |
          ARGS=""
          V="${{ inputs.version }}"
          if [ -n "$V" ]; then case "$V" in *@*) ARGS="$ARGS --version ${V%@*} --release ${V#*@}";; *) ARGS="$ARGS --version $V";; esac; fi
          [ "${{ inputs.screens }}" != "false" ] && ARGS="$ARGS --screens"
          [ "${{ inputs.replace_screens }}" = "true" ] && ARGS="$ARGS --replace-screens"
          [ "${{ inputs.prepare_only }}" = "true" ] && ARGS="$ARGS --prepare-only"
          [ "${{ inputs.previews }}" = "true" ] && ARGS="$ARGS --previews"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          [ "${{ inputs.diagnose }}" = "true" ] && ARGS="$ARGS --diagnose"
          [ "${{ inputs.audit }}" = "true" ] && ARGS="$ARGS --audit"
          [ "${{ inputs.events }}" = "true" ] && ARGS="$ARGS --events"
          [ -n "${{ inputs.nominate }}" ] && ARGS="$ARGS --events --events-file ${{ inputs.nominate }}"
          [ "${{ inputs.gamecenter }}" = "true" ] && ARGS="$ARGS --gamecenter"
          [ "${{ inputs.iap }}" = "read" ] && ARGS="$ARGS --iap"
          case "${{ inputs.iap }}" in sale:*) V2="${{ inputs.iap }}"; ARGS="$ARGS --iap-sale ${V2#sale:}";; esac
          [ "${{ inputs.iap }}" = "setup" ] && ARGS="$ARGS --iap-setup"
          [ "${{ inputs.iap }}" = "packs" ] && ARGS="$ARGS --packs"
          [ "${{ inputs.iap }}" = "submit" ] && ARGS="$ARGS --submit-packs"
          [ "${{ inputs.iap }}" = "resubmit" ] && ARGS="$ARGS --iap-resubmit"
          [ "${{ inputs.iap }}" = "unsubmit" ] && ARGS="$ARGS --unsubmit-packs"
          [ -n "${{ inputs.sales }}" ] && ARGS="$ARGS --sales ${{ inputs.sales }}"
          [ -n "${{ inputs.ppo }}" ] && ARGS="$ARGS --ppo ${{ inputs.ppo }}"
          [ -n "${{ inputs.remove_locales }}" ] && ARGS="$ARGS --remove-locales ${{ inputs.remove_locales }}"
          python -u tools/asc/asc.py $ARGS
